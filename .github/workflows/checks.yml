name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          enable-cache: true
      - run: uv sync --locked --extra train --python 3.10
      - run: uv run --locked --extra train python -m unittest discover -s tests -v
      - run: uv run --locked python tools/check_report.py
      - run: uv run --locked python -m tools.check_benchmark
      - name: Import demo without starting a server
        run: uv run --locked python -c "import app; print('Demo imports successfully')"
